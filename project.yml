name: Stickr
options:
  bundleIdPrefix: de.luiskisters
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4C8444267Z
targets:
  Stickr:
    type: application
    platform: macOS
    sources:
      - path: Sources/StickrCore
      - path: Sources/StickrApp
      - path: Resources/Web
        buildPhase: resources
        type: folder
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.luiskisters.Stickr
        PRODUCT_NAME: Stickr
        INFOPLIST_FILE: Sources/StickrApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_LDFLAGS:
          - "-lsqlite3"
    dependencies:
      - sdk: WebKit.framework
      - sdk: Accelerate.framework
      - sdk: ServiceManagement.framework
      - sdk: Carbon.framework
schemes:
  Stickr:
    build:
      targets:
        Stickr: all
    run:
      config: Debug
    archive:
      config: Release
